<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 135" width="100%" height="135" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0e" />
      <stop offset="100%" stop-color="#040608" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Scanlines -->
    <pattern id="scan" width="100" height="3" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="0.8" opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    /* Blinking Terminal Cursor */
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor { animation: blinkCursor 0.85s infinite; }

    /* Radar / Quantum Gyroscope Rotations */
    @keyframes spinOrbit1 {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinOrbit2 {
      0% { transform: rotate(60deg) scale(0.9); }
      100% { transform: rotate(420deg) scale(0.9); }
    }
    @keyframes spinOrbit3 {
      0% { transform: rotate(120deg) scale(0.8); }
      100% { transform: rotate(480deg) scale(0.8); }
    }

    .orbit-1 { transform-origin: 735px 68px; animation: spinOrbit1 9s linear infinite; }
    .orbit-2 { transform-origin: 735px 68px; animation: spinOrbit2 12s linear infinite reverse; }
    .orbit-3 { transform-origin: 735px 68px; animation: spinOrbit3 15s linear infinite; }

    /* Quantum Core Pulse */
    @keyframes corePulse {
      0%, 100% { r: 5px; opacity: 0.85; filter: drop-shadow(0 0 6px #00ff88); }
      50% { r: 7.5px; opacity: 1; filter: drop-shadow(0 0 14px #00f5ff); }
    }
    .core-dot { animation: corePulse 2.4s ease-in-out infinite; }

    /* Status Dot Blink */
    @keyframes livePulse {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #00ff88); }
      50% { opacity: 0.3; filter: none; }
    }
    .live-dot { animation: livePulse 2s ease-in-out infinite; }
  </style>

  <!-- Terminal Window Background -->
  <rect x="2" y="2" width="846" height="131" rx="10" fill="url(#bg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Window Header Bar -->
  <path d="M 2,12 A 10,10 0 0 1 12,2 L 838,2 A 10,10 0 0 1 848,12 L 848,28 L 2,28 Z" fill="#0c1117" stroke="#1e293b" stroke-width="0.8" />
  
  <!-- Window Controls (Mac / Linux Terminal dots) -->
  <circle cx="18" cy="15" r="4.5" fill="#ff5f56" />
  <circle cx="33" cy="15" r="4.5" fill="#ffbd2e" />
  <circle cx="48" cy="15" r="4.5" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="425" y="18" fill="#64748b" font-size="11" text-anchor="middle" class="font-mono">pranjal@node-01: ~ (zsh)</text>

  <!-- Left: Minimal Hacker Shell Prompt -->
  <g transform="translate(24, 46)" class="font-mono">
    <!-- Command Line 1 -->
    <text x="0" y="16" fill="#00ff88" font-size="13" font-weight="700">➜</text>
    <text x="18" y="16" fill="#38bdf8" font-size="13" font-weight="700">~</text>
    <text x="36" y="16" fill="#f8fafc" font-size="13" font-weight="600">whoami</text>
    <text x="105" y="16" fill="#64748b" font-size="12">--verbose</text>

    <!-- Output Line 1 -->
    <text x="0" y="40" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="-0.3">
      PRANJAL SINGH <tspan fill="#00f5ff" font-size="14" font-weight="600">//</tspan> <tspan fill="#00ff88" font-size="13.5" font-weight="700">SYSTEMS &amp; APPLIED AI ARCHITECT</tspan>
    </text>

    <!-- Output Line 2: Stack Telemetry -->
    <g transform="translate(0, 58)" font-size="10.5">
      <circle cx="4" cy="4" r="3" fill="#00ff88" class="live-dot" />
      <text x="14" y="7" fill="#64748b">STATUS: <tspan fill="#00ff88" font-weight="600">ACTIVE</tspan></text>
      <text x="115" y="7" fill="#334155">|</text>
      <text x="128" y="7" fill="#64748b">STACK: <tspan fill="#38bdf8" font-weight="600">Rust • C++ • Python • TypeScript</tspan></text>
      <text x="365" y="7" fill="#334155">|</text>
      <text x="378" y="7" fill="#64748b">LOC: <tspan fill="#f1f5f9" font-weight="600">IIIT Ranchi '28</tspan></text>
    </g>

    <!-- Command Line 2 with Blinking Cursor -->
    <g transform="translate(0, 75)">
      <text x="0" y="6" fill="#00ff88" font-size="11.5" font-weight="700">➜</text>
      <text x="18" y="6" fill="#38bdf8" font-size="11.5" font-weight="700">~</text>
      <text x="36" y="6" fill="#64748b" font-size="11.5">execute_future</text>
      <rect x="142" y="-4" width="7" height="12" fill="#00ff88" class="cursor" />
    </g>
  </g>

  <!-- Right: Minimal 3D Quantum Gyroscope / Radar Node (Center at 735, 68) -->
  <g id="quantumNode">
    <!-- Outer Bounding Subtle Ring -->
    <circle cx="735" cy="68" r="46" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3, 3" />

    <!-- Orbit 1 (Neon Cyan) -->
    <ellipse cx="735" cy="68" rx="42" ry="15" fill="none" stroke="#00f5ff" stroke-width="1.4" opacity="0.8" class="orbit-1" />
    <circle cx="777" cy="68" r="2.5" fill="#00f5ff" class="orbit-1" />

    <!-- Orbit 2 (Emerald Matrix) -->
    <ellipse cx="735" cy="68" rx="42" ry="15" fill="none" stroke="#00ff88" stroke-width="1.4" opacity="0.8" class="orbit-2" />
    <circle cx="777" cy="68" r="2.5" fill="#00ff88" class="orbit-2" />

    <!-- Orbit 3 (Cyber Purple) -->
    <ellipse cx="735" cy="68" rx="42" ry="15" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.75" class="orbit-3" />
    <circle cx="777" cy="68" r="2" fill="#a855f7" class="orbit-3" />

    <!-- Glowing Quantum Core Dot -->
    <circle cx="735" cy="68" r="5" fill="#ffffff" class="core-dot" />
  </g>

  <!-- Scanline Filter -->
  <rect x="2" y="2" width="846" height="131" rx="10" fill="url(#scan)" pointer-events="none" />
</svg>
