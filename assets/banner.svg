<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e">
        <animate attributeName="stop-color" values="#22c55e;#06b6d4;#a855f7;#22c55e" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#a855f7;#22c55e;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#22c55e;#06b6d4;#a855f7" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    /* Blinking status dot */
    @keyframes blink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #22c55e); }
      50% { opacity: 0.2; filter: none; }
    }
    .status-dot { animation: blink 2s ease-in-out infinite; }

    /* Animated Equalizer DSP bars */
    @keyframes eq1 { 0%, 100% { height: 12px; y: 154px; } 50% { height: 38px; y: 128px; } }
    @keyframes eq2 { 0%, 100% { height: 28px; y: 138px; } 50% { height: 8px; y: 158px; } }
    @keyframes eq3 { 0%, 100% { height: 42px; y: 124px; } 50% { height: 18px; y: 148px; } }
    @keyframes eq4 { 0%, 100% { height: 16px; y: 150px; } 50% { height: 50px; y: 116px; } }
    @keyframes eq5 { 0%, 100% { height: 35px; y: 131px; } 50% { height: 22px; y: 144px; } }

    .eq-bar-1 { animation: eq1 1.2s ease-in-out infinite; }
    .eq-bar-2 { animation: eq2 0.9s ease-in-out infinite 0.15s; }
    .eq-bar-3 { animation: eq3 1.4s ease-in-out infinite 0.3s; }
    .eq-bar-4 { animation: eq4 1.1s ease-in-out infinite 0.1s; }
    .eq-bar-5 { animation: eq5 1.3s ease-in-out infinite 0.25s; }

    /* ECG / DSP Signal Sweep Line */
    @keyframes ecgSweep {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }
    .ecg-line {
      stroke-dasharray: 600, 600;
      animation: ecgSweep 4s linear infinite;
    }

    /* Ambient pulse */
    @keyframes borderPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .card-border { animation: borderPulse 4s ease-in-out infinite; }
  </style>

  <!-- Background Card -->
  <rect x="6" y="6" width="888" height="188" rx="14" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="888" height="188" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" class="card-border" />

  <!-- Background Grid Dots (Subtle Cyber Matrix) -->
  <g opacity="0.12" fill="#58a6ff">
    <circle cx="40" cy="35" r="1.2" /><circle cx="70" cy="35" r="1.2" /><circle cx="100" cy="35" r="1.2" /><circle cx="130" cy="35" r="1.2" />
    <circle cx="40" cy="65" r="1.2" /><circle cx="70" cy="65" r="1.2" /><circle cx="100" cy="65" r="1.2" /><circle cx="130" cy="65" r="1.2" />
    <circle cx="40" cy="95" r="1.2" /><circle cx="70" cy="95" r="1.2" /><circle cx="100" cy="95" r="1.2" /><circle cx="130" cy="95" r="1.2" />
    <circle cx="40" cy="125" r="1.2" /><circle cx="70" cy="125" r="1.2" /><circle cx="100" cy="125" r="1.2" /><circle cx="130" cy="125" r="1.2" />
    <circle cx="40" cy="155" r="1.2" /><circle cx="70" cy="155" r="1.2" /><circle cx="100" cy="155" r="1.2" /><circle cx="130" cy="155" r="1.2" />
  </g>

  <!-- Top Status Bar -->
  <g transform="translate(30, 32)">
    <!-- Status Indicator Pill -->
    <rect x="0" y="0" width="138" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <circle cx="14" cy="12" r="4.5" fill="#22c55e" class="status-dot" />
    <text x="26" y="16" fill="#7ee787" font-size="11" font-weight="600" class="mono">SYSTEM ACTIVE</text>

    <!-- Telemetry Badges -->
    <g transform="translate(150, 0)">
      <rect x="0" y="0" width="168" height="24" rx="6" fill="#161b22" stroke="#238636" stroke-width="0.8" opacity="0.9" />
      <text x="10" y="16" fill="#8b949e" font-size="10.5" class="mono">LATENCY : <tspan fill="#38bdf8" font-weight="bold">&lt;5ms (INT8)</tspan></text>
    </g>

    <g transform="translate(330, 0)">
      <rect x="0" y="0" width="180" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <text x="10" y="16" fill="#8b949e" font-size="10.5" class="mono">RUNTIME : <tspan fill="#a855f7" font-weight="bold">RUST / ONNX / DSP</tspan></text>
    </g>

    <g transform="translate(522, 0)">
      <rect x="0" y="0" width="160" height="24" rx="6" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <text x="10" y="16" fill="#8b949e" font-size="10.5" class="mono">LOC : <tspan fill="#e6edf3" font-weight="bold">IIIT RANCHI '28</tspan></text>
    </g>
  </g>

  <!-- Main Headline -->
  <text x="32" y="94" fill="#f0f6fc" font-size="23" font-weight="800" class="mono" letter-spacing="-0.5">
    PRANJAL SINGH <tspan fill="#38bdf8" font-size="16" font-weight="400">::</tspan> <tspan fill="#a855f7" font-size="15" font-weight="600">SYSTEMS &amp; APPLIED AI</tspan>
  </text>
  <text x="32" y="118" fill="#8b949e" font-size="12.5" class="mono">
    Low-Latency Streaming Voice Pipelines • Local-First Tools • Clinical DSP
  </text>

  <!-- Animated Real-time Audio DSP / Equalizer Spectrum (Right Side) -->
  <g transform="translate(580, 0)">
    <text x="16" y="96" fill="#6e7681" font-size="9.5" class="mono" letter-spacing="1">AUDIO DSP SPECTRUM</text>
    
    <!-- Spectrum Bars -->
    <rect x="18" y="140" width="5.5" height="26" rx="2.5" fill="url(#barGrad)" class="eq-bar-1" />
    <rect x="28" y="132" width="5.5" height="34" rx="2.5" fill="url(#barGrad)" class="eq-bar-3" />
    <rect x="38" y="145" width="5.5" height="21" rx="2.5" fill="url(#barGrad)" class="eq-bar-2" />
    <rect x="48" y="125" width="5.5" height="41" rx="2.5" fill="url(#barGrad)" class="eq-bar-4" />
    <rect x="58" y="138" width="5.5" height="28" rx="2.5" fill="url(#barGrad)" class="eq-bar-5" />
    <rect x="68" y="122" width="5.5" height="44" rx="2.5" fill="url(#barGrad)" class="eq-bar-1" />
    <rect x="78" y="148" width="5.5" height="18" rx="2.5" fill="url(#barGrad)" class="eq-bar-3" />
    <rect x="88" y="130" width="5.5" height="36" rx="2.5" fill="url(#barGrad)" class="eq-bar-2" />
    <rect x="98" y="118" width="5.5" height="48" rx="2.5" fill="url(#barGrad)" class="eq-bar-4" />
    <rect x="108" y="135" width="5.5" height="31" rx="2.5" fill="url(#barGrad)" class="eq-bar-5" />
    <rect x="118" y="142" width="5.5" height="24" rx="2.5" fill="url(#barGrad)" class="eq-bar-1" />
    <rect x="128" y="126" width="5.5" height="40" rx="2.5" fill="url(#barGrad)" class="eq-bar-3" />
    <rect x="138" y="146" width="5.5" height="20" rx="2.5" fill="url(#barGrad)" class="eq-bar-2" />
    <rect x="148" y="134" width="5.5" height="32" rx="2.5" fill="url(#barGrad)" class="eq-bar-4" />
    <rect x="158" y="120" width="5.5" height="46" rx="2.5" fill="url(#barGrad)" class="eq-bar-5" />
    <rect x="168" y="140" width="5.5" height="26" rx="2.5" fill="url(#barGrad)" class="eq-bar-1" />
    <rect x="178" y="132" width="5.5" height="34" rx="2.5" fill="url(#barGrad)" class="eq-bar-2" />
    <rect x="188" y="144" width="5.5" height="22" rx="2.5" fill="url(#barGrad)" class="eq-bar-3" />
    <rect x="198" y="128" width="5.5" height="38" rx="2.5" fill="url(#barGrad)" class="eq-bar-4" />
    <rect x="208" y="136" width="5.5" height="30" rx="2.5" fill="url(#barGrad)" class="eq-bar-5" />
    <rect x="218" y="148" width="5.5" height="18" rx="2.5" fill="url(#barGrad)" class="eq-bar-1" />
    <rect x="228" y="124" width="5.5" height="42" rx="2.5" fill="url(#barGrad)" class="eq-bar-3" />
    <rect x="238" y="142" width="5.5" height="24" rx="2.5" fill="url(#barGrad)" class="eq-bar-2" />
    <rect x="248" y="135" width="5.5" height="31" rx="2.5" fill="url(#barGrad)" class="eq-bar-4" />
    <rect x="258" y="145" width="5.5" height="21" rx="2.5" fill="url(#barGrad)" class="eq-bar-5" />
    <rect x="268" y="150" width="5.5" height="16" rx="2.5" fill="url(#barGrad)" class="eq-bar-1" />
  </g>

  <!-- Oscilloscope / ECG Sinus Rhythm Animated Pulse Wave (Bottom Left to Middle) -->
  <g transform="translate(32, 148)">
    <!-- Base track line -->
    <path d="M 0,16 L 90,16 L 105,-6 L 115,28 L 125,-18 L 135,16 L 170,16 L 180,6 L 195,16 L 270,16 L 285,-6 L 295,28 L 305,-18 L 315,16 L 350,16 L 360,6 L 375,16 L 520,16" 
          fill="none" stroke="#21262d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Sweeping Animated Glow Pulse Line -->
    <path d="M 0,16 L 90,16 L 105,-6 L 115,28 L 125,-18 L 135,16 L 170,16 L 180,6 L 195,16 L 270,16 L 285,-6 L 295,28 L 305,-18 L 315,16 L 350,16 L 360,6 L 375,16 L 520,16" 
          fill="none" stroke="url(#waveGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" 
          class="ecg-line" filter="url(#glow)" />
  </g>
</svg>
